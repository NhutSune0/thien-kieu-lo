<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thiên Kiêu Lộ — P1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Màn hình đăng nhập -->
<div id="login">
  <div class="login-box">
    <h1>⚔️ THIÊN KIÊU LỘ</h1>
    <p class="sub">Thanh Huyền Tông · Kiếm Các Đường</p>
    <img id="hall-portrait" src="assets/nvc-portrait.webp" alt="Kiếm Các Đường">
    <div class="hall-name">🗡️ Kiếm Các Đường <span class="tag">khả dụng</span></div>
    <div class="hall-locked">🧧 Thần Phù · ☯️ Trận Sư · 💊 Dược Vương <span class="tag soon">sắp mở</span></div>
    <input id="name-input" maxlength="16" placeholder="Nhập đạo hiệu của bạn...">
    <button id="join-btn">Vào tông môn</button>
  </div>
</div>

<!-- Game -->
<div id="game" class="hidden">
  <canvas id="cv"></canvas>
  <!-- HUD gọn -->
  <div id="hud">
    <div class="bars">
      <div class="bar hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div class="bar mp"><div id="mp-fill"></div><span id="mp-text"></span></div>
      <div class="bar tv"><div id="tv-fill"></div><span id="tv-text"></span></div>
    </div>
    <div id="stat-line"><span id="lvl-text"></span> · <span id="lt-text"></span> · <span id="pot-text"></span></div>
  </div>
  <div id="skillbar"></div>
  <canvas id="minimap" width="110" height="82"></canvas>
  <div id="mutebtn">🔊</div>
  <!-- Nút menu UI -->
  <div id="menubtns">
    <button data-p="panel-char" title="Nhân vật (C)">👤</button>
    <button data-p="panel-bag" title="Túi đồ (B)">🎒</button>
    <button data-p="panel-map" title="Bản đồ (M)">🗺️</button>
    <button id="chatbtn" title="Chat (Enter)">💬</button>
    <button data-p="panel-settings" title="Cài đặt (Esc)">⚙️</button>
  </div>
  <!-- Panel nhân vật -->
  <div id="panel-char" class="panel">
    <div class="p-head">👤 Nhân vật <span class="p-x" data-x>✕</span></div>
    <div class="p-body" id="char-body"></div>
  </div>
  <!-- Panel túi đồ -->
  <div id="panel-bag" class="panel">
    <div class="p-head">🎒 Túi đồ <span class="p-x" data-x>✕</span></div>
    <div class="p-body" id="bag-body"></div>
  </div>
  <!-- Panel bản đồ lớn -->
  <div id="panel-map" class="panel">
    <div class="p-head">🗺️ Quảng Trường Tông Môn <span class="p-x" data-x>✕</span></div>
    <div class="p-body"><canvas id="bigmap" width="330" height="248"></canvas></div>
  </div>
  <!-- Panel cài đặt -->
  <div id="panel-settings" class="panel">
    <div class="p-head">⚙️ Cài đặt <span class="p-x" data-x>✕</span></div>
    <div class="p-body" id="settings-body"></div>
  </div>
  <!-- Chat thế giới -->
  <div id="chatlog"></div>
  <div id="chatinput-wrap" style="display:none"><input id="chatinput" maxlength="80" placeholder="Nhắn kênh thế giới..."></div>
  <div id="sysmsg"></div>
  <div id="dead-overlay" style="display:none"><div>💀 Đã ngã xuống...<br><span>Hồi sinh sau <b id="dead-count">5</b>s</span></div></div>
  <div id="hint">Chạm: di chuyển · Chạm quái: đánh · Chạm icon: dùng skill</div>
</div>

<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
